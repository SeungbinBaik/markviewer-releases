name: Runner Housekeeping

# A release build needs ~15Gi and the Mac mini runner ran out, so the build
# stopped at its disk-space guard before doing any work. There is no SSH into
# that machine from the release tooling, but the runner is already a shell on
# it — so housekeeping runs the same way a build does.
#
# Every path below is one a later build rebuilds on its own: Xcode build
# products, the cargo registry's downloaded crate sources, and the runner's
# own work tree, which every build wipes at its first step anyway. Nothing
# outside those paths is read or removed.
#
# Measuring is capped, not thorough. Two earlier versions of this workflow sat
# on `du` for twenty minutes without printing a line — on a disk this full,
# walking it costs more than the number is worth. `df` is the number that
# decides whether a build can run, and it is instant.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = free space only, clean = delete regenerable caches'
        required: true
        default: 'report'
        type: choice
        options:
          - report
          - clean

jobs:
  housekeeping:
    # Same label as the build, so this lands on the machine that ran out.
    runs-on: [self-hosted, macOS, ARM64, dmg-capable]

    steps:
      - name: Free space
        run: df -h /

      - name: Clean
        if: ${{ github.event.inputs.mode == 'clean' }}
        run: |
          before=$(df -g / | awk 'NR==2 {print $4}')
          echo "before: ${before}Gi free"

          for d in \
            "$HOME/Library/Developer/Xcode/DerivedData" \
            "$HOME/.cargo/registry/src" \
            "$HOME/.cargo/registry/cache" \
            "$HOME/markviewer-runner/_work"
          do
            [ -e "$d" ] || { echo "skip (absent): $d"; continue; }
            echo "removing: $d"
            rm -rf "$d" 2>/dev/null || true
            mkdir -p "$d" 2>/dev/null || true
            echo "  now: $(df -g / | awk 'NR==2 {print $4}')Gi free"
          done

          after=$(df -g / | awk 'NR==2 {print $4}')
          echo "after: ${after}Gi free"
          if [ "$after" -lt 15 ]; then
            echo "::warning::Still ${after}Gi free; a release build wants ~15Gi. Something outside these paths is holding the disk."
          fi
