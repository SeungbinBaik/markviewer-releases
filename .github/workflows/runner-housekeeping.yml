name: Runner Housekeeping

# A release build needs ~15Gi and the Mac mini runner ran out, so the build
# stopped at its disk-space guard before doing any work. There is no SSH into
# that machine from the release tooling, but the runner is already a shell on
# it — so housekeeping runs the same way a build does.
#
# `locate` finds where the disk actually went. The guesses in the first
# version were wrong: this runner has no Xcode DerivedData and its work tree
# is not under $HOME/markviewer-runner, so clearing those freed nothing.
#
# Every measurement is capped. Two earlier versions sat on an uncapped `du`
# for twenty minutes without printing a line; on a disk this full, walking it
# costs more than the number is worth.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'locate = find what is large, clean = delete the build caches'
        required: true
        default: 'locate'
        type: choice
        options:
          - locate
          - clean

jobs:
  housekeeping:
    # Same label as the build, so this lands on the machine that ran out.
    runs-on: [self-hosted, macOS, ARM64, dmg-capable]

    steps:
      - name: Where this runner lives
        run: |
          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_WORKSPACE=$RUNNER_WORKSPACE"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "--- free space, both volumes ---"
          df -h / /System/Volumes/Data

      - name: What is large
        if: ${{ github.event.inputs.mode == 'locate' }}
        run: |
          # -x stays on one filesystem, -d1 stops at the first level, and the
          # timeout means a slow branch costs a minute rather than the job.
          echo "=== \$HOME, one level ==="
          timeout 120 du -x -d 1 -h "$HOME" 2>/dev/null | sort -rh | head -20 || echo "(timed out)"
          echo "=== runner work tree ==="
          timeout 90 du -x -d 2 -h "$(dirname "$RUNNER_WORKSPACE")" 2>/dev/null | sort -rh | head -12 || echo "(timed out)"
          echo "=== /Users, one level ==="
          timeout 60 du -x -d 1 -h /Users 2>/dev/null | sort -rh | head -10 || echo "(timed out)"

      - name: Clean
        if: ${{ github.event.inputs.mode == 'clean' }}
        run: |
          before=$(df -g / | awk 'NR==2 {print $4}')
          echo "before: ${before}Gi free"

          # The work tree the runner actually uses. Every build wipes its own
          # workspace at the first step, so nothing here outlives a run.
          if [ -n "$RUNNER_WORKSPACE" ]; then
            root=$(dirname "$RUNNER_WORKSPACE")
            echo "clearing work tree: $root"
            rm -rf "$root"/*/*/target 2>/dev/null || true
            rm -rf "$RUNNER_TEMP"/* 2>/dev/null || true
          fi
          rm -rf "$HOME/.cargo/registry/src" "$HOME/.cargo/registry/cache" 2>/dev/null || true
          rm -rf "$HOME/Library/Caches/Homebrew" 2>/dev/null || true

          after=$(df -g / | awk 'NR==2 {print $4}')
          echo "after: ${after}Gi free"
          if [ "$after" -lt 15 ]; then
            echo "::warning::Still ${after}Gi free; a release build wants ~15Gi. Run mode=locate and look at what is left."
          fi
