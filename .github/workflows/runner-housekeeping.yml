name: Runner Housekeeping

# A release build needs ~15Gi and the Mac mini runner ran out, so the build
# stopped at its disk-space guard before doing any work. There is no SSH into
# that machine from the release tooling, but the runner is already a shell on
# it — so housekeeping runs the same way a build does.
#
# `report` only looks. `clean` removes caches that a later build regenerates
# on its own: Xcode DerivedData, the cargo registry's downloaded sources, and
# the runner's own work tree (which every build wipes at its first step
# anyway). Nothing outside those paths is touched.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = look only, clean = delete regenerable caches'
        required: true
        default: 'report'
        type: choice
        options:
          - report
          - clean

jobs:
  housekeeping:
    # Same label as the build, so this lands on the machine that ran out.
    runs-on: [self-hosted, macOS, ARM64, dmg-capable]

    steps:
      - name: Disk report
        run: |
          echo "=== free space ==="
          df -h /
          echo
          echo "=== largest under \$HOME ==="
          du -sh "$HOME"/* 2>/dev/null | sort -rh | head -15
          echo
          echo "=== regenerable caches ==="
          for d in \
            "$HOME/Library/Developer/Xcode/DerivedData" \
            "$HOME/.cargo/registry" \
            "$HOME/Library/Caches" \
            "$HOME/markviewer-runner/_work" \
            "$HOME/actions-runner/_work"
          do
            [ -e "$d" ] && du -sh "$d" 2>/dev/null
          done
          echo
          echo "=== cargo build dirs over 1G ==="
          find "$HOME" -maxdepth 6 -type d -name target -prune 2>/dev/null | while read -r t; do
            [ -f "$t/CACHEDIR.TAG" ] || continue
            s=$(du -sm "$t" 2>/dev/null | cut -f1)
            [ "${s:-0}" -gt 1000 ] && echo "${s}M  $t"
          done | sort -rn | head -10
          echo "(report done)"

      - name: Clean regenerable caches
        if: ${{ github.event.inputs.mode == 'clean' }}
        run: |
          before=$(df -g / | awk 'NR==2 {print $4}')
          echo "before: ${before}Gi free"

          # Xcode build products. Rebuilt on demand.
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/* 2>/dev/null || true

          # Downloaded crate sources and their archives. Re-fetched on demand.
          rm -rf "$HOME/.cargo/registry/src" "$HOME/.cargo/registry/cache" 2>/dev/null || true

          # The runner's work tree. Every build wipes this at its first step,
          # so nothing here outlives a run by design.
          rm -rf "$HOME/markviewer-runner/_work"/_temp/* 2>/dev/null || true
          find "$HOME/markviewer-runner/_work" -maxdepth 6 -type d -name target -prune 2>/dev/null | while read -r t; do
            [ -f "$t/CACHEDIR.TAG" ] && rm -rf "$t"
          done

          after=$(df -g / | awk 'NR==2 {print $4}')
          echo "after: ${after}Gi free"
          if [ "$after" -lt 15 ]; then
            echo "::warning::Still only ${after}Gi free; a release build wants ~15Gi. See the report above for what else is large."
          fi
