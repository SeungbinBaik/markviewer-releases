name: Build macOS

on:
  repository_dispatch:
    types: [build-macos]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.26 or 1.0.26-beta.1)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta

jobs:
  build-macos:
    # Pinned by capability, not by machine name. Packaging no longer needs
    # Finder (see the Create DMG step), so the label now tracks one thing:
    # whether `hdiutil create` works on that machine. The MacBook runner
    # started failing there with "Resource busy" after ~54s (v1.8.4, and
    # again on v1.8.9-beta.1) and is not diagnosable remotely, so the label
    # sits on the Mac mini. Move it back once the MacBook is verified.
    runs-on: [self-hosted, macOS, ARM64, dmg-capable]
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      channel: ${{ steps.version.outputs.CHANNEL }}

    steps:
      - name: Get version and channel
        id: version
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "VERSION=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
            PAYLOAD_CHANNEL="${{ github.event.client_payload.channel }}"
            echo "CHANNEL=${PAYLOAD_CHANNEL:-stable}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
            INPUT_CHANNEL="${{ inputs.channel }}"
            echo "CHANNEL=${INPUT_CHANNEL:-stable}" >> $GITHUB_OUTPUT
          fi

      - name: Clean workspace
        run: |
          rm -rf ${{ github.workspace }}/*
          rm -rf ${{ github.workspace }}/.??*

      - name: Download source from private repo
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PRIVATE_REPO_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SeungbinBaik/immarkviewer/tarball/v${{ steps.version.outputs.VERSION }} \
            -o source.tar.gz

          tar -xzf source.tar.gz --strip-components=1
          rm source.tar.gz

      # A release builds ARM64, x86_64 and a universal binary, so it needs
      # room. When the disk runs out mid-build the failure surfaces somewhere
      # unrelated — a cargo registry crate whose extracted directory is simply
      # missing, reported as "failed to read plugin permissions: ...toml: No
      # such file or directory" — which costs a 12-minute build and a long
      # detour to diagnose. Say it up front instead.
      #
      # Numbers are measured on this runner: a release failed at 9.5Gi free
      # and succeeded at 16Gi.
      - name: Check disk space
        run: |
          avail=$(df -g / | awk 'NR==2 {print $4}')
          # Fail loudly rather than open: an unreadable number would make
          # every comparison below error out while the step still exits 0,
          # which is a guard that quietly grants permission.
          case "$avail" in
            ''|*[!0-9]*)
              echo "::error::could not read free disk space from df (got '$avail')"
              exit 1
              ;;
          esac
          echo "available: ${avail}Gi"
          if [ "$avail" -lt 8 ]; then
            echo "::error::Only ${avail}Gi free; a release build needs roughly 15Gi. Free space and re-run."
            exit 1
          fi
          if [ "$avail" -lt 15 ]; then
            echo "::warning::Only ${avail}Gi free; a release build needs roughly 15Gi and may fail."
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # The app links a Swift package (the IME bridge) through swift-rs, which
      # shells out to `swift build` and offers no way to pass it a flag. As of
      # Command Line Tools 27.0 SwiftPM defaults to the XCBuild engine, which
      # cannot initialize without an Xcode.app present:
      #
      #   error: Could not initialize build system
      #          "Unknown error parsing property list"
      #
      # The legacy engine still works, so put a `swift` shim ahead of the real
      # one on PATH. Installed ONLY when the default engine is actually broken,
      # so it disappears by itself once the runner gains an Xcode.app or Apple
      # ships a fix — which matters, because `--build-system native` is
      # deprecated and slated for removal.
      - name: Work around SwiftPM build system (CLT-only runners)
        run: |
          probe="$(mktemp -d)/probe"
          mkdir -p "$probe/Sources/probe"
          cat > "$probe/Package.swift" <<'SWIFT'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(name: "probe", targets: [.target(name: "probe")])
          SWIFT
          echo 'public let probe = 0' > "$probe/Sources/probe/probe.swift"

          if swift build --package-path "$probe" >/dev/null 2>&1; then
            echo "SwiftPM default build system works; no shim needed."
            rm -rf "$(dirname "$probe")"
            exit 0
          fi

          echo "::warning::SwiftPM default build system is broken on this runner; using --build-system native"
          shim="$RUNNER_TEMP/swift-shim"
          mkdir -p "$shim"
          real="$(command -v swift)"
          cat > "$shim/swift" <<SHIM
          #!/bin/sh
          if [ "\$1" = "build" ]; then shift; exec "$real" build --build-system native "\$@"; fi
          exec "$real" "\$@"
          SHIM
          chmod +x "$shim/swift"
          echo "$shim" >> "$GITHUB_PATH"
          rm -rf "$(dirname "$probe")"

      - name: Install dependencies
        run: |
          # Use local npm cache for faster installs
          npm install --prefer-offline --no-audit

      - name: Create .env for analytics
        env:
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
        run: |
          cat > .env <<EOF
          VITE_POSTHOG_API_KEY=${VITE_POSTHOG_API_KEY}
          VITE_POSTHOG_HOST=https://app.posthog.com
          VITE_POSTHOG_ENABLED=true
          VITE_ENVIRONMENT=production
          EOF

      - name: Build frontend
        run: npm run build:vite

      - name: Setup code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Decode certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import certificate with -A flag for all apps
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -A

          # Set partition list
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Add keychain to search list
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed s/\"//g)

          # Set as default
          security default-keychain -s build.keychain

          # Clean up
          rm certificate.p12

          # Verify
          security find-identity -v -p codesigning

      - name: Build ARM64
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app

      - name: Build x86_64
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles app

      - name: Create universal binary
        run: |
          mkdir -p /tmp/universal-build
          cp -R src-tauri/target/aarch64-apple-darwin/release/bundle/macos/MarkViewer.app /tmp/universal-build/
          lipo -create \
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/MarkViewer.app/Contents/MacOS/app \
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/MarkViewer.app/Contents/MacOS/app \
              -output /tmp/universal-build/MarkViewer.app/Contents/MacOS/app

      - name: Sign universal app
        env:
            KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
            # Unlock keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

            # Find identity SHA-1
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk '{print $2}')

            echo "Using identity: $SIGNING_IDENTITY"

            # Sign (keychain will be found automatically from search list)
            codesign --force --deep --sign "$SIGNING_IDENTITY" \
              --options runtime \
              --entitlements src-tauri/entitlements.plist \
              /tmp/universal-build/MarkViewer.app

      - name: Create DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Built without Finder, on purpose.
          #
          # create-dmg shells out to AppleScript purely to lay the window out
          # (icon positions, window size). Everything else it does needs no
          # Finder: the Applications entry is a plain symlink and the image
          # itself is hdiutil. On a runner whose *service* context cannot
          # reach Finder that layout step fails with AppleEvent -1712 after a
          # 120s timeout, which pinned releases to whichever machine happened
          # to have working automation.
          #
          # So we replay the layout instead of asking Finder to recreate it:
          # dmg/dmg-ds-store is a .DS_Store captured once from a DMG that was
          # built with Finder available. Dropping it into the staged volume
          # reproduces the same geometry on any runner.
          #
          # If the window layout ever needs to change, rebuild a DMG on a
          # machine where Finder automation works (an interactive shell, not a
          # launchd service), mount it, and re-capture its .DS_Store here.
          STAGE="$(mktemp -d)/MarkViewer"
          mkdir -p "$STAGE"

          cp -R /tmp/universal-build/MarkViewer.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          gh api "repos/${GITHUB_REPOSITORY}/contents/dmg/dmg-ds-store" \
            --jq '.content' | base64 -d > "$STAGE/.DS_Store"

          # A truncated or missing layout would silently ship an ugly DMG.
          if [ ! -s "$STAGE/.DS_Store" ]; then
            echo "::error::failed to fetch dmg/dmg-ds-store"
            exit 1
          fi

          rm -f MarkViewer.dmg
          hdiutil create \
            -volname "MarkViewer" \
            -srcfolder "$STAGE" \
            -ov -format UDZO -imagekey zlib-level=9 \
            MarkViewer.dmg

          rm -rf "$(dirname "$STAGE")"

          # Confirm the layout and the drag-to-install target actually landed
          # in the image, rather than trusting that the staging worked.
          hdiutil attach MarkViewer.dmg -nobrowse -readonly -mountpoint /tmp/dmgverify -quiet
          ls -la /tmp/dmgverify
          test -s /tmp/dmgverify/.DS_Store || { echo "::error::.DS_Store missing from DMG"; hdiutil detach /tmp/dmgverify -quiet; exit 1; }
          test "$(readlink /tmp/dmgverify/Applications)" = "/Applications" || { echo "::error::Applications symlink missing"; hdiutil detach /tmp/dmgverify -quiet; exit 1; }
          hdiutil detach /tmp/dmgverify -quiet

      - name: Sign DMG
        env:
            KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
            # Unlock keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

            # Find identity SHA-1
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk '{print $2}')

            echo "Using identity: $SIGNING_IDENTITY"

            # Sign (keychain will be found automatically)
            codesign --force --sign "$SIGNING_IDENTITY" MarkViewer.dmg

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          xcrun notarytool submit MarkViewer.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait

          xcrun stapler staple MarkViewer.dmg

      - name: Create update bundle
        run: |
          cd /tmp/universal-build
          # Exclude macOS metadata files (._*) to prevent unpack errors
          COPYFILE_DISABLE=1 tar -czf MarkViewer_universal.app.tar.gz --exclude='._*' MarkViewer.app
          mv MarkViewer_universal.app.tar.gz ${{ github.workspace }}/

      - name: Sign update bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx @tauri-apps/cli signer sign MarkViewer_universal.app.tar.gz \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Upload to releases
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ steps.version.outputs.CHANNEL }}" == "beta" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create v${{ steps.version.outputs.VERSION }} \
            --repo SeungbinBaik/markviewer-releases \
            --title "MarkViewer v${{ steps.version.outputs.VERSION }}" \
            --notes "Release v${{ steps.version.outputs.VERSION }}" \
            $PRERELEASE_FLAG \
            MarkViewer.dmg \
            MarkViewer_universal.app.tar.gz \
            MarkViewer_universal.app.tar.gz.sig

      - name: Generate manifest JSON
        id: manifest
        run: |
          cat > generated-manifest.json <<EOF
          {
            "version": "v${{ steps.version.outputs.VERSION }}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$(cat MarkViewer_universal.app.tar.gz.sig)",
                "url": "https://github.com/SeungbinBaik/markviewer-releases/releases/download/v${{ steps.version.outputs.VERSION }}/MarkViewer_universal.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "$(cat MarkViewer_universal.app.tar.gz.sig)",
                "url": "https://github.com/SeungbinBaik/markviewer-releases/releases/download/v${{ steps.version.outputs.VERSION }}/MarkViewer_universal.app.tar.gz"
              }
            }
          }
          EOF

      - name: Upload latest.json (stable only)
        if: steps.version.outputs.CHANNEL == 'stable'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          cp generated-manifest.json latest.json
          gh release upload v${{ steps.version.outputs.VERSION }} \
            --repo SeungbinBaik/markviewer-releases \
            --clobber \
            latest.json

      - name: Checkout markviewer-releases for manifest sync
        uses: actions/checkout@v5
        with:
          repository: SeungbinBaik/markviewer-releases
          ref: main
          path: releases-repo
          token: ${{ secrets.RELEASE_PAT }}

      - name: Sync manifests/latest-beta.json
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          cd releases-repo
          mkdir -p manifests
          cp ../generated-manifest.json manifests/latest-beta.json

          # Stable sync integrity: the just-written manifests/latest-beta.json
          # must be byte-for-byte equal to the latest.json release asset so
          # beta users naturally rejoin stable on the next check. Abort on
          # mismatch rather than risk publishing inconsistent state.
          if [ "${{ steps.version.outputs.CHANNEL }}" == "stable" ]; then
            diff -q ../latest.json manifests/latest-beta.json || {
              echo "::error::latest.json and manifests/latest-beta.json differ byte-level on stable sync";
              exit 1;
            }
          fi

          # URL sanity: the manifest's DMG url must point to this tag's
          # release assets. This guards against a beta-tag URL leaking into
          # a stable sync or vice versa.
          jq -e --arg tag "v${{ steps.version.outputs.VERSION }}" \
            '.platforms | to_entries[] | .value.url | contains("/releases/download/" + $tag + "/")' \
            manifests/latest-beta.json > /dev/null || {
            echo "::error::manifests/latest-beta.json URL does not point to v${{ steps.version.outputs.VERSION }} release assets";
            exit 1;
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/latest-beta.json
          if git diff --cached --quiet; then
            echo "manifests/latest-beta.json unchanged, skipping commit"
            exit 0
          fi
          git commit -m "chore(manifest): sync latest-beta.json for v${{ steps.version.outputs.VERSION }} (${{ steps.version.outputs.CHANNEL }})"
          git push origin main

      - name: Clean up
        if: always()
        run: |
          # Restore user keychain state — the Setup code signing step
          # set default-keychain to build.keychain and rewrote the user
          # search list. On a self-hosted runner that's the user's own
          # Mac, so without explicit restore here every build leaves
          # the host with a broken default-keychain pointer (-25307
          # "no default keychain") and login.keychain dropped from the
          # search list. Run before delete-keychain so the build.keychain
          # vanishing doesn't leave a phantom default.
          security default-keychain -s ~/Library/Keychains/login.keychain-db || true
          security list-keychains -d user -s ~/Library/Keychains/login.keychain-db /Library/Keychains/System.keychain || true
          security delete-keychain build.keychain || true
          rm -rf ${{ github.workspace }}/*
          rm -rf ${{ github.workspace }}/.??*

  update-website:
    needs: build-macos
    if: needs.build-macos.outputs.channel != 'beta'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v5
        with:
          repository: SeungbinBaik/markviewer
          token: ${{ secrets.RELEASE_PAT }}

      # Single source of truth for every crawler-/LLM-readable version string
      # on markviewer.com lives in scripts/sync-version.sh. That script touches
      # index.html (JSON-LD softwareVersion + JS fallback), version.js, llms.txt,
      # sitemap.xml lastmod, and the subpage footer date. Runtime
      # fetchLatestVersion() still updates the visible download UI, but crawlers
      # and the no-JS path now see correct values too.
      - name: Sync version strings on website
        run: |
          if [ -x ./scripts/sync-version.sh ]; then
            ./scripts/sync-version.sh "${{ needs.build-macos.outputs.version }}"
          else
            # Safety net: if the website repo is somehow missing the sync script
            # (e.g. an out-of-order revert), keep the JSON-LD softwareVersion in
            # sync at minimum so we don't regress the previous narrow behavior.
            echo "::warning::scripts/sync-version.sh missing — falling back to softwareVersion-only update"
            sed -i "s/\"softwareVersion\": \"[^\"]*\"/\"softwareVersion\": \"${{ needs.build-macos.outputs.version }}\"/" index.html
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Website already in sync — skipping commit."
            exit 0
          fi
          git add -A
          git commit -m "Sync website to v${{ needs.build-macos.outputs.version }}"
          git push
